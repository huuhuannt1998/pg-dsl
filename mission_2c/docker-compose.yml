version: "3.8"

# Mission 2C dual-mode reproducibility artifact.
#
# Usage:
#   docker-compose up evaluation              # stub-mode (default, ~10 s)
#   MODE=real-llm docker-compose up evaluation # real-LLM mode (~5-10 min on M4)
#
# Requirements for real-llm-mode:
#   - Ollama running on the HOST machine (Mac/Linux): `ollama serve`
#   - Qwen model pulled: `ollama pull qwen2.5-coder:14b`
#   - Container reaches Ollama via host.docker.internal (Docker Desktop default)

services:
  evaluation:
    build:
      context: ..
      dockerfile: mission_2c/Dockerfile
    image: pgdsl:mission_2c
    container_name: pgdsl-mission2c
    environment:
      - MODE=${MODE:-stub}
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal:11434}
    volumes:
      # Persist results to host
      - ./results:/pgdsl/mission_2c/results
      - ./evaluation/tables:/pgdsl/mission_2c/evaluation/tables
      - ./evaluation/figures:/pgdsl/mission_2c/evaluation/figures

  notebook:
    build:
      context: ..
      dockerfile: mission_2c/Dockerfile
    image: pgdsl:mission_2c
    container_name: pgdsl-notebook-2c
    volumes:
      - ./:/pgdsl/mission_2c
    ports:
      - "8891:8888"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal:11434}
    command: >
      jupyter notebook
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --NotebookApp.token=''
        --NotebookApp.password=''
        --notebook-dir=/pgdsl/mission_2c
